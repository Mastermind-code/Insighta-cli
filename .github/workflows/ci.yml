name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Install linter
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Verify CLI entry point
        run: insighta --help
